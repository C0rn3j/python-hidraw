[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hidraw-pure"
version = "1.3"
description = "Pure-python linux hidraw bindings"
readme = { file = "README", content-type = "text/plain" }
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [
    { name = "Vincent Pelletier", email = "plr.vincent@gmail.com" },
]
keywords = ["linux", "human interface device", "HID", "hidraw"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "ioctl-opt",
]

[project.urls]
Homepage = "https://github.com/vpelletier/python-hidraw"

[tool.setuptools.packages.find]
include = ["hidraw*"]

[tool.ruff]
line-length = 80

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'D203',   # incorrect-blank-line-before-class         - Clashes with D211
    #'D211',   # no-blank-line-before-class                - Clashes with D203
    #'D212',   # multi-line-summary-first-line             - Clashes with D213
    'D213',   # multi-line-summary-second-line            - Clashes with D212
    'COM812'  # missing-trailing-comma                    - Formatter takes care of this
]
